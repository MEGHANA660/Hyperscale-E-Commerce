apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: hyperscale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
        - name: auth-service
          image: ghcr.io/meghana660/hyperscale-auth-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "300m"
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: hyperscale
spec:
  selector:
    app: auth-service
  ports:
    - port: 8000
      targetPort: 8000
# NOTE: the `jwt-secret` Secret is deliberately NOT defined here. `make k8s-secret` creates it
# with a random value (a committed value would be public, and anyone could forge login tokens).
