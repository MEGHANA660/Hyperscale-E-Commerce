apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: hyperscale
spec:
  replicas: 2
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/meghana660/hyperscale-order-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/hyperscale
            - name: MONGO_URI
              value: mongodb://mongodb:27017
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: hyperscale
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
