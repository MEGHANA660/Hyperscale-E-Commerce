apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: hyperscale
spec:
  # One replica on purpose: the Min Heap fulfilment queue lives in this process's memory,
  # so a second replica would hold a different queue. Raise this once the queue is shared.
  replicas: 1
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: ghcr.io/meghana660/hyperscale-order-service:latest
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: postgresql://postgres:postgres@postgres:5432/hyperscale
            - name: MONGO_URI
              value: mongodb://mongodb:27017
            - name: PRODUCT_SERVICE_URL
              value: http://product-service:8000
            - name: PAYMENT_SERVICE_URL
              value: http://payment-service:8000
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: jwt-secret
                  key: secret_key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: hyperscale
spec:
  selector:
    app: order-service
  ports:
    - port: 8000
      targetPort: 8000
